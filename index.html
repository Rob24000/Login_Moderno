<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon"
        href="https://img.favpng.com/15/13/21/computer-icons-user-login-desktop-wallpaper-png-favpng-50cVSt0m1jw7SRtPEv8KvVUvF.jpg"
        type="image/x-icon">
    <title>Login & Register</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body>
    <div class="container" id="container">
        <!-- Sign Up Form-->
        <div class="form-container sign-up-container">
            <form action="#">
                <h1>Crea tu Cuenta <i class="fa-regular fa-user user-blue"></i></h1><br>
                <input type="text" placeholder="Nombre Completo">
                <input type="email" placeholder="Correo">
                <input type="password" placeholder="Contraseña">
                <button>Iniciar</button><br>
                <span>Siguenos en nuestras redes sociales:</span>

                <div class="social-icons">
                    <a href="#"><i class="fa-brands fa-google" title="Goole"></i></a>
                    <a href="#"><i class="fa-brands fa-facebook"></i></a>
                    <a href="#"><i class="fa-brands fa-twitter"></i></a>
                    <a href="#"><i class="fa-brands fa-youtube"></i></a>
                </div>
            </form>
        </div>

        <!-- Sign in Form -->
        <div class="form-container sign-in-container">
            <form action="#">
                <h1>¡Bienvenido!<i class="fa-regular fa-hand"></i> </h1> <br>
                <img src="https://cdn-icons-png.flaticon.com/512/9187/9187604.png" width="90px" alt="Usuario"><br>
                <input type="email" placeholder="Correo">
                <input type="password" placeholder="Contraseña">
                <a href="#" class="forgot-password" id="forgotbtn">¿Olvidaste tu contraseña?</a>
                <button>Ingresar</button>

                <div class="social-icons">
                    <a href="#"><i class="fa-brands fa-google"></i></a>
                    <a href="#"><i class="fa-brands fa-facebook"></i></a>
                    <a href="#"><i class="fa-brands fa-twitter"></i></a>
                    <a href="#"><i class="fa-brands fa-youtube"></i></a>
                </div>
            </form>
        </div>

        <!-- Overlay -->
        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <img src="img/circulo.png" width="141px"><br>
                    <h1>¿Tienes una Cuenta?</h1>
                    <p>Inicia sesión y empieza tu trabajo </p><br>
                    <button class="ghost" id="signIn">Acceder</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <img src="https://cdn-icons-png.flaticon.com/256/9385/9385270.png" width="141px"><br>
                    <h1>¿Eres nuevo? Registrate</h1>
                    <p>Crea una cuenta y empieza tu trabajo </p><br>
                    <button class="ghost" id="signUp"> Registrarse</button>
                </div>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>

</html>
